origem_do_pedido:
  quem: Leandro
  quando: "05/11/2026 20:46 (Brasília)"
  pedido: "precisamos colocar o logo da LRI e nao dos passaros"
  complemento: "podem até ter alguma animação"
  excecao_a_heranca: >-
    Revoga, só neste ponto, o item de ux-spec-v1.yaml fora_de_escopo "Ícone do Zammad no topo do menu do legado
    (.search .logo .icon-logo, botão do fluxo de atividades) ...". A parte do mesmo item sobre LeftSidebarHeader.vue
    (app Vue) continua fora do escopo. O resto da v1 a v3 (UI-only, sem redesign, sem core, sem i18n) continua valendo.

escopo:
  interface: "Somente o app clássico (CoffeeScript). O app Vue (desktop e mobile) fica como está."
  pontos:
    - id: P1-menu
      onde: "navigation.jst.eco:11-13 — div.logo.js-toggleNotifications com svg.icon-logo e div.activity-counter"
      hoje: "pássaro do Zammad (sprite do núcleo); clique abre e fecha o fluxo de atividades; contador vermelho por cima"
      depois: "marca LRI no mesmo slot; clique, contador e atalho de teclado inalterados"
    - id: P2-avatar-do-sistema
      onde: "avatar_system.jst.eco — span.avatar com fundo branco inline e svg.icon-logo; usado só quando o usuário é o id 1 (user.coffee:111-113)"
      hoje: "pássaro do Zammad nas entradas do sistema"
      depois: "marca LRI estática"
      abrangencia: >-
        Recomendação: todas as ocorrências do avatar do usuário de sistema (fluxo de atividades do painel,
        notificações e qualquer outro lugar que desenhe o avatar do id 1), porque é a mesma identidade e o mesmo template. Restringir ao fluxo
        de atividades deixaria o pássaro nos outros lugares para o mesmo usuário. Ponto a confirmar na revisão
        (decisao_para_revisao D1).
  fora_de_escopo:
    - "Fotos e avatares gerados de atendentes e clientes (usam background-image no .avatar, não svg.icon-logo)."
    - "Avatar do agente de IA (.activity-ai-avatar, ícone ai-agent) e qualquer outro ícone funcional."
    - "Link 'zammad.org' com o ícone logo no rodapé de login, cadastro, verificação e redefinição de senha (login.jst.eco:134, signup.jst.eco:22, signup/verify.jst.eco:25, password/*.jst.eco, admin_password_auth/*.jst.eco): atribuição, mantida como na v1."
    - "LeftSidebarHeader.vue e o app Vue em geral; favicon; e-mails."
    - "Nome acessível do botão do fluxo de atividades: hoje é um div sem nome nem foco (lacuna do upstream). Corrigir exige mudar o template do núcleo; registrar, não tratar aqui."
    - "Arquivos de marca novos ou redesenhados."

