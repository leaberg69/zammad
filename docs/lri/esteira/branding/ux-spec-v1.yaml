  logos:
    destino: "public/assets/lri/ (fontes em docs/lri/brand-assets/)"
    regras_de_geracao:
      - "Não redesenhar: só recorte de viewBox, cor de preenchimento e composição."
      - "SVG sem script, sem href externo, sem foreignObject; raster só embutido como data:image/png;base64 (ponto para o security-A)."
      - "LRI: área útil medida nos paths do original = x 233 a 767, y 251 a 524 (534 x 273, cerca de 1,96:1); viewBox recortado com 4% de respiro."
    variantes:
      - { arquivo: "lri-logo-claro.svg", base: "lri-logo.svg", fill: "#3d7a12", uso: "fundo claro, compõe o logo composto claro", motivo: "mesmo verde do destaque no claro; 5,26 sobre branco, firme a 32 px de altura" }
      - { arquivo: "lri-logo-escuro.svg", base: "lri-logo.svg", fill: "#74b527", uso: "fundo escuro", motivo: "verde primário da marca; 4,62 a 7,02 sobre os fundos escuros" }
      - { arquivo: "ird-logo-escuro.png", base: "ird-logo.png 874 x 246", tratamento: "preto vira #ffffff, laranja mantido, fundo transparente", uso: "fundo escuro", motivo: "o preto do logo dá 1,64 a 1,81 sobre fundo escuro" }
      - { arquivo: "grupo-lri-logo.svg", uso: "setting product_logo (tema claro)", composicao: "empilhado, viewBox 400 x 200 (2:1): LRI claro centrado em cima, 176 x 90; respiro de 20; IRD.Net original centrado embaixo, 320 x 90", tamanho_exibido: "legado .login .company-logo máx. 200 x 100 (zammad.scss:3644) e prévia Admin > Marca 200 x 100 (zammad.scss:11216) = 200 x 100; Vue CommonLogo max-h-32 max-w-56 (128 x 224) = 224 x 112", por_que_svg: "o servidor redimensiona raster para caber em 200 x 100 (product_logo.rb, FIT 200 x 100) e perde nitidez em 2x; SVG é guardado sem redimensionar (store_logo)" }
      - { arquivo: "grupo-lri-logo-escuro.svg", uso: "troca por CSS no escuro: legado [data-theme=dark] .login .company-logo e .branding .logo-preview; Vue desktop [data-theme=dark] [data-zammad-target=CommonLogo]; mobile [data-zammad-target=CommonLogo] sempre", composicao: "igual ao claro, com lri-logo-escuro e ird-logo-escuro" }
      - { arquivo: "grupo-lri-logo-horizontal.svg", uso: "cabeçalho da KB (fundo #f9fafb)", composicao: "LRI claro, fio vertical de 1 px #b7b7b7, IRD.Net original; mesma altura 64, espaçamento 24; viewBox cerca de 402 x 64 (6,3:1), exibido 201 x 32 a 2em" }
    alt_text: "vem de product_name (Central de Atendimento Grupo LRI); não escrever texto no arquivo"
    favicon: >-
      FORA DO SLICE. O legado não declara link rel=icon (o navegador busca /favicon.ico); desktop.html.erb:8 e
      mobile.html.erb:9 apontam para /favicon.ico e /apple-touch-icon.png, arquivos versionados do upstream em
      public/. Trocar é editar núcleo. Caminhos a decidir: (a) o proxy reverso da fase 5 serve /favicon.ico e
      /apple-touch-icon.png a partir de /assets/lri/; (b) alteração de núcleo registrada em
      DIFERENCAS-UPSTREAM.md. Depende também do símbolo quadrado de 512 px (lacuna do PLANO).

