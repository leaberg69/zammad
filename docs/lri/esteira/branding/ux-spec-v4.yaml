geometria:
  regra: "A marca ocupa o slot que o pássaro ocupa hoje; o slot não muda de tamanho nem de posição. Encaixe 'contain', centrado, sem distorcer nem espelhar (inclusive em RTL)."
  P1-menu:
    slot_medido:
      padrao: "svg.icon-logo 42 x 36 (svg-dimensions.css:97), dentro de .search .logo com margem -4px 10px 0 12px (zammad.scss:5395-5406)"
      estreito: "35 x 30 com margin-left 4px, sob o mixin phone: largura até 767 px ou #app.navigation-collapsed (zammad.scss:5408-5416; mixin em 224-232)"
    marca_resultante:
      padrao: "caixa 42 x 21,5; tinta cerca de 39 x 20"
      estreito: "caixa 35 x 17,9; tinta cerca de 32 x 17"
    camadas: "o contador .activity-counter continua acima da marca, na mesma posição (right -3px, bottom 2px)"
  P2-avatar-do-sistema:
    slot_medido: ".avatar 40 x 40 redondo (zammad.scss:5656-5668); 30 x 30 no phone e em .size-30; 22 x 22 em .size-30 no phone"
    marca_resultante: "largura da caixa = 80% do diâmetro: 32 x 16,4 em 40; 24 x 12,3 em 30; 17,6 x 9 em 22"
    por_que_80: "um retângulo 1,956:1 inscrito no círculo cabe até cerca de 89% do diâmetro; 80% deixa respiro igual dos dois lados e não encosta na borda"

cor_e_contraste:
  regra: "Logotipo é isento do critério de texto do WCAG, mas precisa ficar reconhecível no fundo (requisito herdado da v1)."
  P1-menu: "#74b527 sobre o menu: 6,02:1 no tema claro (--background-quaternary hsl(231,9%,16%) = #25262c) e 6,50:1 no escuro (hsl(230,7%,13%) = #1f2023)"
  P2-avatar-do-sistema: "#3d7a12 sobre branco: 5,26:1 nos dois temas (o fundo branco é inline no template e não muda com o tema)"

movimento:
  abordagens:
    A-estatica:
      descricao: "Marca estática nos dois pontos."
      pro: "Mais conservadora; nada a testar além da troca."
      contra: "Ignora o 'podem até ter alguma animação'."
    B-entrada-e-realce-so-no-menu:
      descricao: "No menu, entrada suave uma única vez e realce leve no hover; avatar do sistema estático."
      pro: "Atende o pedido opcional sem movimento nos registros; um ponto só, uma vez, sem efeito no layout."
      contra: "Duas regras de movimento a testar; nada muda em toque (sem hover)."
  recomendacao: B-entrada-e-realce-so-no-menu
  B_regras:
    entrada: "ao renderizar o menu, a marca vai de opacidade 0 e escala 0,92 para opacidade 1 e escala 1 em 240 ms (mesma duração da transição que o upstream já usa em .search .logo), ease-out, 1 iteração"
    realce: "hover em .search .logo: escala 1 para 1,06 em 160 ms ease-out; volta ao sair"
    onde_animar: >-
      Só a camada da marca. O contêiner .search .logo não recebe animação, para que as regras do upstream que o
      escondem (.search.focused .logo e .search.filled .logo no phone, opacidade 0) continuem valendo sem conflito.
    proibido: "loop, iteração infinita, spinner, rotação, piscar, mudança de cor, deslocamento de layout ou de hitbox, movimento no avatar"
    reduced_motion: "com prefers-reduced-motion: reduce, sem entrada e sem realce: marca estática"

tecnica:
  onde: "app/assets/stylesheets/custom/lri-branding.css (customização suportada, carregada por application.css). Sem core, sem template, sem i18n, sem JavaScript."
  seletores:
    P1-menu: ".search .logo > .icon-logo (único svg.icon-logo dentro de .search .logo)"
    P2-avatar-do-sistema: ".avatar > .icon-logo (só o avatar de sistema põe svg.icon-logo dentro de .avatar; avatares reais usam background-image)"
  principio: >-
    O svg do pássaro continua no DOM com o mesmo tamanho, só invisível, para manter caixa, hitbox e contador; a
    marca entra como camada visual do próprio contêiner, que hoje não usa ::before nem ::after (conferido em
    zammad.scss para .avatar e .search .logo). Nenhum seletor global de .icon-logo ou de .avatar.
  acessibilidade: "Árvore de acessibilidade inalterada: a camada não leva texto em content; o clique, o atalho de teclado (keyboard_shortcuts.coffee:187) e o foco seguem como estão."

decisoes_para_revisao:
