name: LRI

# CI do código próprio do Grupo LRI no fork (branding, contrib/lri, docs/lri e a guarda de zona).
# O CI completo do upstream (ci.yaml) fica desligado no fork; o docker-ci continua construindo a imagem.

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  lint:
    name: Lint do código LRI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Stylelint (CSS de branding)
        run: >-
          pnpm exec stylelint
          'app/assets/stylesheets/custom/lri-*.css'
          'app/assets/stylesheets/custom_knowledge_base_public/lri-*.css'
          'app/frontend/apps/desktop/styles/custom/lri-*.css'
          'app/frontend/apps/mobile/styles/custom/lri-*.css'
      - name: Markdownlint (docs/lri)
        run: pnpm exec markdownlint-cli2 'docs/lri/**/*.md' CLAUDE.md
      - name: Use Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Logos gerados batem com as fontes
        run: |
          python contrib/lri/branding/gerar_logos.py
          if ! git diff --exit-code -- public/assets/lri; then
            echo "::error::public/assets/lri difere do que gerar_logos.py produz a partir de docs/lri/brand-assets. Rode o gerador e commite."
            exit 1
          fi
      - name: Scripts Python compilam
        run: python -m py_compile contrib/lri/qa/capture.py contrib/lri/branding/gerar_logos.py contrib/lri/deploy/test/*.py
      - name: Shellcheck dos scripts de deploy
        run: shellcheck contrib/lri/deploy/nginx-entrypoint.sh contrib/lri/deploy/test/nginx_zones_test.sh

  nginx-zones:
    name: Nginx das zonas (interna x pública)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Teste do proxy com upstream de eco
        run: contrib/lri/deploy/test/nginx_zones_test.sh

  zone-guard:
    name: Guarda de zona (RSpec e RuboCop)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: zammad/zammad-ci:latest
    services:
      postgresql:
        image: postgres:18
        env:
          POSTGRES_USER: zammad
          POSTGRES_PASSWORD: zammad
      redis:
        image: redis:6
    env:
      RAILS_ENV: test
      Z_LOCALES: "en-us:de-de"
      TZ: 'Europe/London'
      REDIS_URL: redis://redis:6379
      CI_SKIP_ASSETS_PRECOMPILE: 'true'
      CI_SKIP_DB_RESET: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Cache Rubygems
        uses: actions/cache@v6
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-lri-bundler-${{ hashFiles('Gemfile.lock') }}
      - name: Preparar Rails e banco de teste
        shell: bash
        run: |
          source /etc/profile.d/rvm.sh
          bundle config set --local deployment 'true'
          bundle install -j "$(nproc)"
          bundle exec ruby .gitlab/configure_environment.rb
          bundle exec rake zammad:db:init
      - name: RuboCop do código LRI e dos pontos tocados no núcleo
        shell: bash
        run: |
          source /etc/profile.d/rvm.sh
          bundle exec rubocop lib/lri spec/lib/lri spec/requests/lri spec/system/lri spec/support/lri_zone.rb \
            config/initializers/lri_zone_guard.rb contrib/lri \
            app/channels/application_cable/connection.rb lib/sessions/event/login.rb \
            lib/sessions/event/base.rb lib/sessions/client.rb \
            app/controllers/application_controller/has_user.rb \
            app/controllers/knowledge_base/public/base_controller.rb \
            app/channels/graphql_channel.rb app/graphql/gql/action_cable_subscriptions.rb \
            lib/auth.rb app/models/user.rb app/models/external_credential.rb lib/external_credential \
            spec/models/external_credential \
            app/controllers/sessions_controller.rb app/graphql/gql/queries/application_config.rb \
            app/graphql/gql/subscriptions/config_updates.rb
      - name: RSpec da guarda de zona e das suítes do upstream que ela toca
        shell: bash
        run: |
          source /etc/profile.d/rvm.sh
          bundle exec rspec spec/lib/lri spec/requests/lri \
            spec/lib/sessions spec/channels spec/graphql/gql/subscriptions \
            spec/requests/session_spec.rb spec/graphql/gql/mutations/login_spec.rb \
            spec/requests/knowledge_base \
            spec/lib/auth_spec.rb spec/lib/external_credential spec/models/external_credential \
            spec/models/organization_spec.rb spec/graphql/gql/mutations/user/password_reset \
            spec/requests/user_spec.rb spec/graphql/gql/queries/application_config_spec.rb \
            -t ~searchindex -t ~integration -t ~required_envs
