    - { severidade: med, questao: "Barra inset #74b527 no item ativo do menu (C5): é só cor, sem mudar layout, mas é um traço visual novo. Necessária para manter 3:1 no estado ativo (2,86 sem ela). O PM confirma?" }
    - { severidade: med, questao: "Terminologia: 'chamado' (PLANO) ou 'ticket' (tradução oficial pt-BR). Mudar exige contribuição em translations.zammad.org, ou aceitar 'ticket' na UI." }
    - { severidade: low, questao: "Cor do LRI no logo claro: escolhido #3d7a12, coerente com o destaque. O verde primário #74b527 também é permitido (logotipo é isento de contraste), mas fica fraco a 32 px na KB." }

acceptance_visuals:
  ambiente: "Playwright headless, viewport 1440 x 900, deviceScaleFactor 1; tema forçado por document.documentElement.dataset.theme = light ou dark (legado e Vue) e emulateMedia colorScheme. Dados: 1 cliente com 3 chamados (aberto, pendente, fechado), 1 agente, KB com categorias LRI e IRD.Net e 1 artigo em cada. Locale pt-br."
  antes_e_depois: "Capturar as mesmas telas no commit base (aad8867cd2) e no diff e anexar o par."
  telas:
    - id: V1-login
      url: "/#login (legado), claro e escuro"
      verdade:
        - "Logo composto Grupo LRI dentro do cartão, máximo 200 x 100, sem distorção; no escuro a variante escura (nenhum preto sobre #38393e)."
        - "Título da aba: Central de Atendimento Grupo LRI."
        - "Botão Entrar com fundo #3d7a12 (rgb 61,122,18) e texto branco."
        - "Rótulos em pt-BR (Usuário / email, Senha, Lembrar de mim, Esqueceu a senha?)."
        - "Rede sem 404 em /assets/lri/* e em /api/v1/system_assets/product_logo/*."
    - id: V2-foco-teclado
      url: "/#login, claro e escuro, foco por Tab em usuário, senha, Entrar e Esqueceu a senha?"
      verdade:
        - "Borda e anel de foco #3d7a12 no claro e #74b527 no escuro em cada parada; recorte com zoom de 200% anexado."
        - "Contraste medido do anel contra o fundo adjacente: 3:1 ou mais."
    - id: V3-portal-lista-cliente
      url: "/#ticket/view/my_tickets como cliente, claro e escuro"
      verdade:
        - "Nenhum azul de destaque residual: nenhum elemento visível com cor computada de matiz 195 a 215 e saturação acima de 40% (exceto avatares e as cores de visual_tokens.legado.nao_alterar)."
        - "Item ativo do menu com fundo #3d7a12, texto branco e barra inset #74b527 à esquerda."
        - "Links em #3d7a12 (claro) e #74b527 (escuro)."
    - id: V4-portal-novo-chamado
      url: "/#customer_ticket_new como cliente, claro"
      verdade:
        - "Campo em foco com borda e anel verdes; botão primário de envio verde com texto branco."
        - "Seletor de grupo com grupos LRI e IRD.Net; item realçado do dropdown com fundo #3d7a12 e texto branco."
    - id: V5-agente-dashboard
      url: "/#dashboard como agente, claro e escuro"
      verdade:
        - "Menu lateral com item ativo verde e barra; abas de tarefa ativas (.nav-tab.is-active) verdes."
        - "Nenhum azul de destaque residual (mesmo critério de V3)."
    - id: V6-agente-chamado-aberto
      url: "/#ticket/zoom/ID como agente, claro e escuro, com resposta em edição"
      verdade:
        - "Botão primário de atualizar verde com texto branco; hover #2c5a0d."
        - "Botão de visibilidade interno ([data-state=internal]) verde; a nota interna mantém a borda alaranjada upstream."
        - "Contador da barra lateral (tabsSidebar-tab-count--info) verde com texto branco."
        - "No escuro, texto em cor de destaque (label-highlight, state-internal) em #74b527, não #3d7a12."
    - id: V7-botao-primario-estados
      url: "recortes do V6: default, hover, focus-visible e active, claro e escuro"
      verdade:
        - "Fundo e texto conforme C2; contraste do texto 4,5:1 ou mais, medido no recorte."
    - id: V8-link-estados
      url: "link Esqueceu a senha?, link em artigo e link dentro do popover de usuário (escuro)"
      verdade:
        - "Claro #3d7a12 (5,0:1 ou mais); escuro #74b527 (4,6:1 ou mais); dentro de popover escuro #9ecb68 (4,5:1 ou mais)."
    - id: V9-kb-publica
      url: "/help/pt-br e um artigo da categoria IRD.Net (só claro)"
      verdade:
        - "Cabeçalho com logo horizontal Grupo LRI a 32 px de altura, sem distorção; links do menu em #3d7a12."
        - "Ícones de categoria e links do artigo em #3d7a12; tag com fundo #3d7a12 e texto branco."
        - "Placeholder da busca em pt-BR."
    - id: V10-admin-marca
      url: "/#settings/branding como admin, claro"
      verdade:
        - "Nome do produto Central de Atendimento Grupo LRI; prévia do logo 200 x 100 com o composto; Organização Grupo LRI; idioma pt-BR e fuso America/Sao_Paulo em Sistema."
    - id: V11-mobile
      url: "/mobile/login e lista de chamados em /mobile como agente, viewport 390 x 844"
      verdade:
        - "Logo na variante escura; botão primário #74b527 com texto preto; links #74b527."
    - id: V12-desktop-beta
      url: "/desktop/login e /desktop/dashboard com ui_desktop_beta_switch ligado só no ambiente de teste, claro e escuro"
      verdade:
        - "Botão primário e item de navegação ativo em #3d7a12 com texto branco nos dois temas; link e foco #74b527 no escuro."
        - "Logo na variante escura no tema escuro."
  regua:
    - "Texto abaixo de 4,5:1 nas telas capturadas: 0 nos pares que envolvem cor de marca (medir-tela.js ou axe color-contrast). Pares upstream sem cor de marca que já falham são listados e não bloqueiam."
    - "Layout entre antes e depois: só cor e imagem do logo mudam; mesma caixa por elemento, tolerância de 1 px, exceto a imagem do logo."
    - "Emoji como ícone e avisos de página simultâneos: inalterados."
  so_se_prova_rodando:
    - "Troca do logo por content: url no tema escuro em Chrome, Firefox e WebKit."
    - "Ordem de cascata: custom/ depois de zammad.scss no build de produção (assets:precompile)."
    - "Sobrescritas do Vue sem @layer vencendo as utilidades sem alcançar seleção bg-blue-800 com texto branco."
    - "Logo SVG com PNG embutido aceito pelo upload de product_logo e servido como image/svg+xml."
