name: LRI imagem

# Imagem do fork do Grupo LRI (Dockerfile multi-stage do repositório, com lib/lri e contrib/lri) em
# ghcr.io/leaberg69/zammad-lri. Em pull request e em execução manual fora da develop só constrói, confere e
# escaneia; publica no push da develop (develop-<sha>) e nas tags lri-vX.Y.Z (X.Y.Z, sem alias móvel).
# Só o job de publicação tem packages: write e publica exatamente a imagem escaneada (artefato do job anterior).
# Autenticação só pelo GITHUB_TOKEN. Actions fixadas por SHA e scanner por digest.

on:
  pull_request:
  push:
    branches: [develop]
    tags: ['lri-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lri-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# A tag de imagem de uma versão (X.Y.Z) é imutável: republicar a mesma versão é recusado no job de publicação.

env:
  IMAGE: ghcr.io/leaberg69/zammad-lri
  LOCAL_IMAGE: zammad-lri:ci
  # aquasec/trivy:0.58.1, anterior ao comprometimento das tags do Trivy em 2026, fixado pelo digest.
  TRIVY_IMAGE: aquasec/trivy@sha256:ab70a02200597efa04748f210f793936eb647cbcdb0ea69cc30b226d6f5a22c7

jobs:
  imagem:
    name: Imagem do fork (build, conferência e scan)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.ref.outputs.publish }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Uma tag fora do formato não pode virar, por um trecho do nome, a tag de uma versão já publicada.
      - name: Validar a referência e decidir se publica
        id: ref
        run: |
          valid_release_tag() {
            printf '%s' "$1" | grep -Eq '^lri-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$'
          }
          for ok in lri-v1.2.3 lri-v10.0.1 lri-v7.3.0-rc.1; do
            valid_release_tag "$ok" || { echo "autoteste: $ok deveria ser aceita"; exit 1; }
          done
          for bad in lri-v1.2.3_test lri-v1.2 lri-v01.2.3 lri-vx.y.z lri-v1.2.3- lri-v1.2.3.4 xlri-v1.2.3; do
            ! valid_release_tag "$bad" || { echo "autoteste: $bad deveria ser recusada"; exit 1; }
          done

          publish=false
          case "$GITHUB_REF" in
            refs/tags/*)
              valid_release_tag "$GITHUB_REF_NAME" || { echo "Tag '$GITHUB_REF_NAME' fora do formato lri-vX.Y.Z[-pré]; nada publicado."; exit 1; }
              publish=true ;;
            refs/heads/develop)
              [ "$GITHUB_EVENT_NAME" = pull_request ] || publish=true ;;
          esac
          [ "$GITHUB_EVENT_NAME" = pull_request ] && publish=false
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Publicação neste evento ($GITHUB_EVENT_NAME, $GITHUB_REF): $publish" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Tags e rótulos
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=develop-,format=short,enable=${{ github.ref == 'refs/heads/develop' }}
            type=match,pattern=^lri-v(\d+\.\d+\.\d+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?)$,group=1
          labels: |
            org.opencontainers.image.title=zammad-lri
            org.opencontainers.image.description=Central de Atendimento Grupo LRI

      - name: Build (multi-stage)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            BUILD_LABEL=lri
          labels: ${{ steps.meta.outputs.labels }}
          pull: true
          load: true
          push: false
          tags: ${{ env.LOCAL_IMAGE }}

      - name: Conferir o conteúdo do Grupo LRI na imagem
        run: |
          docker run --rm --entrypoint sh "$LOCAL_IMAGE" -c '
            set -e
            test -x contrib/lri/deploy/nginx-entrypoint.sh
            test -f lib/lri/zone_guard.rb
            test -f config/initializers/lri_zone_guard.rb
            grep -q "\.lri\.docker$" VERSION
          '
          docker run --rm --entrypoint contrib/lri/deploy/nginx-entrypoint.sh \
            -e LRI_NGINX_DRY_RUN=1 -e LRI_NGINX_INC_DIR=/tmp/lri -e LRI_NGINX_SITE=/tmp/site.conf \
            -e LRI_ZONE_KEY=ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci \
            -e LRI_FQDN=suporte.example.com -e LRI_INTERNAL_HOST=atendimento.example.com \
            -e LRI_MW_HOST=suporte.example.net -e LRI_PUBLIC_HOSTS="suporte.example.com suporte.example.net" \
            "$LOCAL_IMAGE"

      - name: Scan de vulnerabilidades (Trivy)
        run: |
          mkdir -p trivy "$HOME/.cache/trivy"
          trivy() {
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy:/root/.cache/trivy" \
              -v "$PWD/trivy:/out" "$TRIVY_IMAGE" "$@"
          }
          # Relatório completo como artefato; o job falha só em CRITICAL com correção disponível.
          trivy image --scanners vuln --format table --output /out/relatorio.txt "$LOCAL_IMAGE"
          trivy image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 --skip-db-update "$LOCAL_IMAGE"

      - name: Publicar o relatório do scan
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: trivy-zammad-lri
          path: trivy/
          if-no-files-found: warn
          retention-days: 30

      - name: Guardar a imagem escaneada para a publicação
        if: steps.ref.outputs.publish == 'true'
        run: docker save "$LOCAL_IMAGE" | gzip -1 > zammad-lri.tar.gz

      - name: Entregar a imagem ao job de publicação
        if: steps.ref.outputs.publish == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: zammad-lri-imagem
          path: zammad-lri.tar.gz
          retention-days: 1
          compression-level: 0

  publicar:
    name: Publicar no GHCR
    needs: imagem
    if: needs.imagem.outputs.publish == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    # Publicações em fila, nunca canceladas: cada versão vai ao registro inteira.
    concurrency:
      group: lri-image-publicar
      cancel-in-progress: false
    steps:
      - name: Receber a imagem escaneada
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: zammad-lri-imagem

      - name: Carregar a imagem
        run: gunzip -c zammad-lri.tar.gz | docker load

      - name: Login no GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar
        env:
          TAGS: ${{ needs.imagem.outputs.tags }}
        run: |
          if [ -z "$TAGS" ]; then
            echo "Nenhuma tag gerada para $GITHUB_REF; nada publicado."
            exit 1
          fi
          for tag in $TAGS; do
            case "$tag" in
              *:develop-*) ;;
              *)
                if docker manifest inspect "$tag" > /dev/null 2>&1; then
                  echo "A versão $tag já está publicada; uma versão não é republicada. Crie uma tag lri-v nova."
                  exit 1
                fi ;;
            esac
            docker tag "$LOCAL_IMAGE" "$tag"
            docker push "$tag"
            echo "publicada: $tag" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$(echo "$TAGS" | head -n1)")
          echo "digest: $digest" | tee -a "$GITHUB_STEP_SUMMARY"
